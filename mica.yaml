mica_spec: "0.2.6"
name: flamehaven-verification-ledger
mode: memory_injection
description: >
  Master MICA Package governing all validation lanes:
  Equation-to-Artifact (EQA, runs TOE-TEST-0001~0056+),
  Biomolecular AI Validation (BAV), and Bioscience Compliance (BSC).
  EQA gate protocol, SPAR/Omega thresholds, chart conventions,
  portal wiring standards, and UX/UI rules are documented in playbook;
  the credibility architecture (provenance classing, understatement posture,
  reproduction anchors, citable metadata) is documented in credibility-architecture.

metadata:
  version: "1.10.0"
  last_updated: "2026-05-31"
  eqa_run_range: "TOE-TEST-0001~0056"
  eqa_archive: "TOE-TEST-0001~0051 (real reports, data-driven; synthetic registry removed in 1.7.0)"
  bav_experiments: "EXP-001~034 (6 cards + archive)"
  credibility_architecture: "Pillars 1-2-3a complete (provenance classes, understatement, reproduction anchors, metadata + dual license); 3b (whole-ledger DOI + ORCID) pending real values"
  di_count: 26
  session_count: 9

layers:
  - name: archive
    path: memory/verification-ledger.mica.archive.json
    format: json
    loading_hint: always
  - name: playbook
    path: memory/verification-ledger-playbook.md
    format: markdown
    loading_hint: always
  - name: credibility-architecture
    path: memory/credibility-architecture.md
    format: markdown
    loading_hint: always

invocation_protocol:
  primary_pattern: readme_protocol

update_triggers:
  - on_explicit_save
