mica_spec: "0.2.6"
name: flamehaven-verification-ledger
mode: memory_injection
description: >
  Master MICA Package governing all validation lanes:
  Equation-to-Artifact (EQA, runs TOE-TEST-0001~0056+),
  Biomolecular AI Validation (BAV), and Bioscience Compliance (BSC).
  EQA gate protocol, SPAR/Omega thresholds, chart conventions,
  portal wiring standards, and UX/UI rules are fully documented in playbook.

metadata:
  version: "1.3.0"
  last_updated: "2026-05-29"
  eqa_run_range: "TOE-TEST-0001~0056"
  di_count: 15
  session_count: 4

layers:
  - name: archive
    path: memory/verification-ledger.mica.archive.json
    format: json
    loading_hint: always
  - name: playbook
    path: memory/verification-ledger-playbook.md
    format: markdown
    loading_hint: always

invocation_protocol:
  primary_pattern: readme_protocol

update_triggers:
  - on_explicit_save
