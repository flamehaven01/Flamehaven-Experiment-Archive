mica_spec: "0.2.8"
name: flamehaven-verification-ledger
mode: memory_injection
description: >
  Master MICA Package governing all validation lanes:
  Equation-to-Artifact (EQA, TOE-TEST-0001~0059+),
  Biomolecular AI Validation (BAV, EXP-001~034),
  Bioscience Compliance (BSC), and Methodology & Frameworks (M&F / Extra).
  The playbook is split per lane (eqa/bav/bsc/mf) plus a cross-lane common
  file. verification-ledger-playbook is the slim index/router (loaded always);
  the lane files load on_demand so a task only pulls the island it touches.
  Shared protocols (Public API build, OPSEC sanitizer, UI/UX SDK) live in
  playbook-common. Credibility architecture (provenance classing, understatement,
  reproduction anchors, citable metadata; DOI 10.5281/zenodo.20483364,
  ORCID 0009-0009-2641-4280) is in credibility-architecture.

layers:
  - name: archive
    path: memory/verification-ledger.mica.archive.json
    format: json
    loading_hint: always
  - name: playbook
    path: memory/verification-ledger-playbook.md
    format: markdown
    loading_hint: always
  - name: playbook-common
    path: memory/playbook-common.md
    format: markdown
    loading_hint: on_demand
  - name: playbook-eqa
    path: memory/playbook-eqa.md
    format: markdown
    loading_hint: on_demand
  - name: playbook-bav
    path: memory/playbook-bav.md
    format: markdown
    loading_hint: on_demand
  - name: playbook-bsc
    path: memory/playbook-bsc.md
    format: markdown
    loading_hint: on_demand
  - name: playbook-mf
    path: memory/playbook-mf.md
    format: markdown
    loading_hint: on_demand
  - name: credibility-architecture
    path: memory/credibility-architecture.md
    format: markdown
    loading_hint: always

di_policy:
  namespace_mode: domain_namespaced
  critical_binding_required: true

invocation_protocol:
  primary_pattern: readme_protocol

update_triggers:
  - on_explicit_save
