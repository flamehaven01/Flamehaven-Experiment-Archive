mica_spec: "0.2.6"
name: flamehaven-verification-ledger
mode: memory_injection
description: >
  Master MICA Package governing all validation lanes:
  Equation-to-Artifact (EQA, runs TOE-TEST-0001~0056+),
  Biomolecular AI Validation (BAV), and Bioscience Compliance (BSC).
  EQA gate protocol, SPAR/Omega thresholds, chart conventions,
  portal wiring standards, and UX/UI rules are documented in playbook;
  the credibility architecture (provenance classing, understatement posture,
  reproduction anchors, citable metadata) is documented in credibility-architecture.

metadata:
  version: "1.14.0"
  last_updated: "2026-06-03"
  eqa_run_range: "TOE-TEST-0001~0056"
  eqa_archive: "TOE-TEST-0001~0051 reconstructed by provenance (v1.13.0): 7 verification runs (0001~0007) + 44 non_run_artifact (0008~0051); engine verified real by re-execution; append-only point-of-use notes; governed by memory/eqa-reconstruction-standard.md"
  bav_experiments: "EXP-001~034 (6 cards + archive)"
  zenodo_doi: "10.5281/zenodo.20483364"
  orcid: "0009-0009-2641-4280"
  credibility_architecture: "Pillars 1-2-3 complete (provenance classing, understatement, reproduction anchors, metadata; DOI 10.5281/zenodo.20483364 + ORCID wired); JOSS/arXiv deferred (endorsement constraints)"
  di_count: 28
  session_count: 10

layers:
  - name: archive
    path: memory/verification-ledger.mica.archive.json
    format: json
    loading_hint: always
  - name: playbook
    path: memory/verification-ledger-playbook.md
    format: markdown
    loading_hint: always
  - name: credibility-architecture
    path: memory/credibility-architecture.md
    format: markdown
    loading_hint: always

invocation_protocol:
  primary_pattern: readme_protocol

update_triggers:
  - on_explicit_save
