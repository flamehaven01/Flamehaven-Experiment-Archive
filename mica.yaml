mica_spec: "0.2.6"
name: flamehaven-verification-ledger
mode: memory_injection
description: "Master MICA Package governing all validation lanes: Equation-to-Artifact (EQA), Biomolecular AI Validation, and Bioscience Compliance."

layers:
  - name: archive
    path: memory/verification-ledger.mica.archive.json
    format: json
    loading_hint: always
  - name: playbook
    path: memory/verification-ledger-playbook.md
    format: markdown
    loading_hint: always

invocation_protocol:
  primary_pattern: readme_protocol

update_triggers:
  - on_explicit_save
