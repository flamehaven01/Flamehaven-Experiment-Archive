# Flamehaven Ledger Sanitizer config (v1.1)
# Config-first: detectors, workspace markers, ignore globs, and false-positive
# allowlist live here, not hardcoded. See sanitizer/README.md.

# Detectors to run. "fix" rules rewrite content; "detect" rules only report.
detectors:
  abs_path_collapse: fix      # workspace absolute paths -> [workspace]/<basename>
  hangul_redact: fix          # Korean (Hangul) runs -> [redacted]
  credibility_clean: fix      # pseudo-science symbol-soup credentials + grandiose attribution -> neutral
  ipv4_address: detect        # IPv4 exposure (report only; may be legitimate data)
  email_address: detect       # email / PII exposure
  secret_token: detect        # API keys / bearer tokens / long hex secrets
  credibility_slop: detect    # residual pseudo-science symbol markers (runs on all files)
  synthetic_marker: detect    # fabrication tag "[synthetic]" / mock data (runs on all files)
  deprecated_kd_field: detect # deprecated KD JSON keys (is_negative/contextuality_proxy) in data files
  promotional_language: detect  # superlatives / self-promotion in public surface (scope-gated)
  jargon_language: detect       # unexplained internal codes / abbreviations (scope-gated)

# promotional_language: enforce the understatement posture on the public-facing
# surface only. Scope, term list, and allowlist are config (not hardcoded).
promo_scope:                  # only these authored files are checked (verbatim reports excluded)
  - index.html
  - eqa.html
  - README.md
promo_terms:                  # superlative / strong-appeal words; ambiguous tech words excluded
  - revolutionary
  - ultimate
  - world-class
  - breakthrough
  - cutting-edge
  - state-of-the-art
  - first-ever
  - unprecedented
  - authoritative
  - absolute
  - groundbreaking
  - game-changing
  - industry-leading
  - unparalleled
promo_allowlist:              # legitimate technical usages (regex, checked in +/-24 char context)
  - '(?i)absolute\s+path'     # "absolute path(s)" is a file-system term, not promotion

# Internal jargon terms that must be explained (or avoided) in public prose.
# When a term is used with its expansion in parens — e.g. "cross-domain consistency (SR9)" —
# add a jargon_allowlist entry so the detector does not flag it.
jargon_terms:
  - sr9          # cross-domain consistency score (internal Flamehaven code)
  - di2          # reasoning deviation score (internal Flamehaven code)
  - p_e2e        # end-to-end reliability probability (internal Flamehaven code)
  - rexsyn       # internal biomedical pipeline name
  - nnsl         # internal signal-processing system name
  - lawbinder    # internal governance constraint component
  - toe          # Theorem/Observation/Equation lane abbreviation (internal)

jargon_allowlist:          # regex — checked in +/-24 char context around the match.
  # Page-level definition (a term carrying an inline expansion anywhere on the page)
  # is handled in detect_jargon per playbook section 5. These anchors cover the
  # remaining legitimate uses that are NOT a full page definition: list groupings,
  # short inline expansions, and component-name pairings. They are deliberately
  # specific (no bare "pipeline"/"reasoning"), so unexplained bare jargon still flags.
  - '(?i)\(\s*(sr9|di2|p[_-]?e2e)\b'           # parenthetical "(SR9)" / "(SR9, DI2, ..."
  - '(?i)[,/]\s*(sr9|di2|p[_-]?e2e)\b'         # list member "SR9, DI2, p_e2e"
  - '(?i)(sr9|di2|p[_-]?e2e)\s*[,)]'           # trailing list member "..., DI2)"
  - '(?i)di2 reasoning|sr9 cross-domain|p[_-]?e2e\s*='   # inline metric expansions
  - '(?i)\+\s*nnsl|nnsl resonance|nnsl\s*/|rexsyn-nexus'  # NNSL / RExSyn component pairing
  - '(?i)governance|fail-closed|escalat|inhibit|\bcritic'  # LawBinder context
  - '(?i)toe-test|toe core|toe contract|toe legacy|toe-spar|paper-to-toe|flamehaven-toe|foundational'  # TOE

# Credibility slop: grandiose / pseudo-scientific authority phrases.
# These terms trigger the credibility_slop detector (detect-only, all files).
# Note: bare "sovereign" and codename slugs (e.g. SOVEREIGN-ORIGIN) are NOT
# matched — only compound phrases that assert fabricated status.
credibility_slop_terms:
  - sovereign-grade
  - sovereign threshold
  - Sovereign Research Asset
  - Sovereign Recovery

# Workspace leak markers that gate abs_path_collapse (case-insensitive contains).
markers:
  - Sanctum
  - STRUCTURA
  - "Users/dream"
  - "Users\\dream"

# Glob directories never scanned.
ignore_dirs:
  - .git
  - .claude
  - node_modules
  - __pycache__
  - sanitizer

# File extensions scanned.
extensions: [json, md, html, js, yaml, yml, cff, txt]

# Known-safe matches (regex). Calibration proposes additions here over time;
# a human confirms before they suppress a finding.
allowlist:
  - '0\.0\.0\.0'            # bind-all placeholder, not a real host
  - '127\.0\.0\.1'         # loopback
  - 'example\.(com|org)'   # RFC 2606 example domains
  - '(?i)your_[a-z_]*api_key_here'   # documentation placeholder, not a real key
  - '(?i)_api_key_here'              # documentation placeholder
